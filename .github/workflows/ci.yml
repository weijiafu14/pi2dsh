name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      # The reviewed lockfile pins the published host graph; check:host verifies
      # it. Unit/pack checks no longer consume a sibling source checkout.
      - run: pnpm install --frozen-lockfile
        env:
          # Release CI must install today's explicitly pinned alpha packages.
          # This is CI-only: user profiles retain their own age/build policy.
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: 0
      - run: pnpm verify
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: 0
